name: Android companion and inference gateway
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
      - name: Test inference gateway (stdlib-only)
        run: python3 -m unittest discover -s gateway/tests -v
      - name: Checkout pinned public v-e-r-a source for HTTP interop
        uses: actions/checkout@v7
        with:
          repository: thebrazenbeard/v-e-r-a
          ref: f3ce7456a291b8e16d004dd1d4e54a51bb98a4dc
          path: _interop/v-e-r-a
          persist-credentials: false
      - name: Cross-repository four-server HTTP wire tests (synthetic)
        env:
          VERA_INTERFACE_SOURCE_ROOT: ${{ github.workspace }}/_interop/v-e-r-a
        run: |
          test -f "$VERA_INTERFACE_SOURCE_ROOT/interface/server.py"
          test "$(git -C "$VERA_INTERFACE_SOURCE_ROOT" rev-parse HEAD)" = "f3ce7456a291b8e16d004dd1d4e54a51bb98a4dc"
          python3 -m unittest -v gateway.tests.test_real_hybrid_http_interop
      - name: Run Android unit tests
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Build installable debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vera-companion-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
