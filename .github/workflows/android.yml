name: Android foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - id: android
        continue-on-error: true
        uses: android-actions/setup-android@v3
      - id: gradle_setup
        continue-on-error: true
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Install SDK and run unit tests
        id: verify
        shell: bash
        run: |
          set +e
          {
            echo "setup-android outcome: ${{ steps.android.outcome }}"
            echo "setup-gradle outcome: ${{ steps.gradle_setup.outcome }}"
            echo "JAVA_HOME=$JAVA_HOME"
            java -version
            command -v sdkmanager || true
            sdkmanager "platforms;android-37" "build-tools;36.0.0"
            sdk_rc=$?
            command -v gradle || true
            gradle --version
            gradle --no-daemon --stacktrace :app:testDebugUnitTest
            test_rc=$?
            echo "sdk_rc=$sdk_rc"
            echo "test_rc=$test_rc"
          } > android-ci.log 2>&1
          if [ "$sdk_rc" -ne 0 ] || [ "$test_rc" -ne 0 ]; then
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
          else
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
          fi
          exit 0
      - name: Upload Android CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-diagnostics
          path: android-ci.log
      - name: Enforce verification result
        shell: bash
        run: test "${{ steps.verify.outputs.exit_code }}" = "0"
