name: Android foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 37
        id: sdk
        continue-on-error: true
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0" > sdk-log.txt 2>&1
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Unit tests
        id: tests
        continue-on-error: true
        run: gradle --non-interactive :app:testDebugUnitTest > gradle-log.txt 2>&1
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-diagnostics
          path: |
            sdk-log.txt
            gradle-log.txt
      - name: Fail on diagnostic step failure
        if: steps.sdk.outcome != 'success' || steps.tests.outcome != 'success'
        run: exit 1
