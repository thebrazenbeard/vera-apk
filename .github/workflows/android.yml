name: Android companion and inference gateway
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
      - name: Checkout reviewed STM journal implementation
        uses: actions/checkout@v7
        with:
          repository: thebrazenbeard/stm
          ref: 03d8f3e555e66da76d93d46ddea3bdcfa465c01c
          path: external-stm
      - name: Install encrypted STM test dependency
        run: python3 -m pip install cryptography==48.0.1
      - name: Test inference gateway and V2 device authorization
        env:
          PYTHONPATH: gateway:external-stm
          VERA_STM_SOURCE: external-stm
        run: python3 -m unittest discover -s gateway/tests -v
      - name: Run Android unit tests
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Build installable debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vera-companion-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
